<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="Sequência de contribuições de EricLps">
<style>
text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif}
.fade{opacity:0;animation:fade .7s ease-out forwards}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.n{opacity:0}
@keyframes on{to{opacity:1}}
@keyframes off{to{opacity:0}}
.ring{fill:none;stroke:#9D6BE0;stroke-width:5;stroke-linecap:round;stroke-dasharray:251;stroke-dashoffset:251;
  transform-origin:247.5px 71px;transform:rotate(-90deg);
  animation:fill 1.4s ease-out .2s forwards, pulse 2.4s ease-in-out 1.6s infinite}
@keyframes fill{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{stroke:#9D6BE0;stroke-width:5}50%{stroke:#C9A3FF;stroke-width:6.5}}
.fire{fill:#B48EE0;transform-origin:247.5px 41px;animation:flicker .9s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scale(1,1) rotate(0)}25%{transform:scale(.9,1.1) rotate(-5deg)}
  50%{transform:scale(1.06,.94) rotate(4deg)}75%{transform:scale(.95,1.07) rotate(-2deg)}}</style>
