<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="img" aria-label="divisor de fogo">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a1a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff5a1a"/>
      <stop offset="1" stop-color="#ff5a1a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spark" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset=".35" stop-color="#ff9a2a"/>
      <stop offset="1" stop-color="#ff4500" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .s{animation:run 4.5s cubic-bezier(.45,0,.55,1) infinite}
    @keyframes run{0%{transform:translateX(0);opacity:0}10%,90%{opacity:1}100%{transform:translateX(1100px);opacity:0}}
    .l{animation:pulse 3s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  </style>
  <rect class="l" x="0" y="11" width="1200" height="2" fill="url(#line)"/>
  <ellipse class="s" cx="50" cy="12" rx="40" ry="10" fill="url(#spark)"/>
</svg>
