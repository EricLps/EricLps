<svg xmlns="http://www.w3.org/2000/svg" width="400" height="180" viewBox="0 0 400 180" role="img" aria-label="Linguagens dos repositórios de EricLps">
<style>
text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif}
.fade{opacity:0;animation:fade .7s ease-out forwards}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.n{opacity:0}
@keyframes on{to{opacity:1}}
@keyframes off{to{opacity:0}}@keyframes s0{from{stroke-dasharray:0 100}to{stroke-dasharray:35.56 100}}@keyframes s1{from{stroke-dasharray:0 100}to{stroke-dasharray:26.47 100}}@keyframes s2{from{stroke-dasharray:0 100}to{stroke-dasharray:17.38 100}}@keyframes s3{from{stroke-dasharray:0 100}to{stroke-dasharray:8.29 100}}@keyframes s4{from{stroke-dasharray:0 100}to{stroke-dasharray:8.29 100}}
.ringbg{opacity:.18}
.glow{transform-origin:300px 100px;animation:glow 3.2s ease-in-out 2.10s infinite}
@keyframes glow{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}</style>
<rect x="0.5" y="0.5" rx="8" width="399" height="179" fill="#0D1117" stroke="#3A0C0C"/>

