# Gera, de hora em hora, a animação do morcego comendo o gráfico de contribuições
# e os cards animados (estatísticas, linguagens e sequência), e publica os SVGs na branch `output`.
# Tudo fica num workflow só porque a publicação substitui a branch `output` inteira.
name: Bat contributions

on:
  schedule:
    - cron: "0 * * * *"   # de hora em hora
  workflow_dispatch:       # botão "Run workflow" para rodar na hora
  push:
    branches: [main]

permissions:
  contents: write          # precisa escrever na branch `output`

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar SVGs do morcego
        run: node scripts/bat-contrib.mjs "${{ github.repository_owner }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar cards animados
        run: node scripts/profile-cards.mjs "${{ github.repository_owner }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
