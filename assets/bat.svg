<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 48" width="80" height="48" role="img" aria-label="morcego">
  <style>
    .flap{transform-box:fill-box;transform-origin:50% 60%;animation:flap .5s steps(1) infinite}
    @keyframes flap{0%{transform:scale(1,1)}50%{transform:scale(.92,.55)}}
    .bob{animation:bob 1.6s ease-in-out infinite alternate}
    @keyframes bob{from{transform:translateY(3px)}to{transform:translateY(-3px)}}
  </style>
  <g class="bob"><g class="flap"><image href="data:image/png;base64," x="4" y="6.5" width="72" height="35" style="image-rendering:pixelated"/></g></g>
</svg>
