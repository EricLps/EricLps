<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 48" width="1200" height="48" role="img" aria-label="divisor de sangue escorrendo">
  <defs>
    <linearGradient id="blood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a000c"/>
      <stop offset=".55" stop-color="#8e0b20"/>
      <stop offset="1" stop-color="#b3142c"/>
    </linearGradient>
    <!-- some nas pontas -->
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".12" stop-color="#fff"/>
      <stop offset=".88" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="edges"><rect width="1200" height="48" fill="url(#fade)"/></mask>
    <!-- brilho que corre pela linha -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a6e" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff5a6e" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff5a6e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .drip{transform-box:fill-box;transform-origin:50% 0;animation:drip ease-in-out infinite alternate}
    @keyframes drip{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
    .drop{animation-name:fall;animation-timing-function:cubic-bezier(.55,0,1,.45);animation-iteration-count:infinite}
    @keyframes fall{0%,55%{transform:translateY(0);opacity:0}58%{opacity:1}100%{transform:translateY(26px);opacity:0}}
    .sheen{animation:run 6s ease-in-out infinite}
    @keyframes run{from{transform:translateX(-200px)}to{transform:translateX(1200px)}}
  </style>

  <g mask="url(#edges)">
    <!-- a linha de sangue, com a borda de baixo irregular -->
    <path d="M0,4 H1200 V10 Q1150,13 1100,10 T1000,11 T900,10 T800,12 T700,10 T600,12 T500,10 T400,12 T300,10 T200,11 T100,10 T0,11 Z" fill="url(#blood)"/>
    <rect class="sheen" x="0" y="4" width="200" height="3" fill="url(#sheen)"/>

    <!-- gotas escorrendo (cada uma estica e encolhe no seu ritmo) -->
    <g fill="url(#blood)">
      <g transform="translate(150 9)"><path class="drip" d="M-3,0 h6 v10 a3,3 0 0 1 -6,0z" style="animation-duration:2.6s"/></g>
      <g transform="translate(262 9)"><path class="drip" d="M-2,0 h4 v6 a2,2 0 0 1 -4,0z" style="animation-duration:3.1s;animation-delay:-1s"/></g>
      <g transform="translate(390 10)"><path class="drip" d="M-4,0 h8 v15 a4,4 0 0 1 -8,0z" style="animation-duration:3.4s;animation-delay:-.6s"/></g>
      <g transform="translate(470 9)"><path class="drip" d="M-2,0 h4 v7 a2,2 0 0 1 -4,0z" style="animation-duration:2.4s;animation-delay:-1.7s"/></g>
      <g transform="translate(598 10)"><path class="drip" d="M-3.5,0 h7 v20 a3.5,3.5 0 0 1 -7,0z" style="animation-duration:3.8s;animation-delay:-2.2s"/></g>
      <g transform="translate(705 9)"><path class="drip" d="M-2.5,0 h5 v9 a2.5,2.5 0 0 1 -5,0z" style="animation-duration:2.9s;animation-delay:-.3s"/></g>
      <g transform="translate(820 10)"><path class="drip" d="M-3,0 h6 v13 a3,3 0 0 1 -6,0z" style="animation-duration:3.2s;animation-delay:-1.4s"/></g>
      <g transform="translate(930 9)"><path class="drip" d="M-2,0 h4 v5 a2,2 0 0 1 -4,0z" style="animation-duration:2.5s;animation-delay:-.9s"/></g>
      <g transform="translate(1048 10)"><path class="drip" d="M-3,0 h6 v11 a3,3 0 0 1 -6,0z" style="animation-duration:3.6s;animation-delay:-2.6s"/></g>
    </g>

    <!-- pingos caindo das gotas maiores -->
    <g fill="#a3112a">
      <circle class="drop" cx="390" cy="29" r="2.6" style="animation-duration:3.4s"/>
      <circle class="drop" cx="598" cy="34" r="2.4" style="animation-duration:3.8s;animation-delay:-1.5s"/>
      <circle class="drop" cx="150" cy="22" r="2" style="animation-duration:4.2s;animation-delay:-2.8s"/>
      <circle class="drop" cx="820" cy="26" r="2.2" style="animation-duration:4.6s;animation-delay:-.7s"/>
      <circle class="drop" cx="1048" cy="24" r="2" style="animation-duration:5s;animation-delay:-3.3s"/>
    </g>
  </g>
</svg>
